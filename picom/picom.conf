# ==============================================================================
# Picom Compositor Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# Opacity Rules
# ------------------------------------------------------------------------------
# Opacity of non-focused (inactive) windows (80% opacity)
inactive-opacity = 0.8;

# Opacity of active (focused) windows (100% opacity)
active-opacity = 1.0;

# Opacity of window titlebars and borders
frame-opacity = 1.0;

# Let inactive opacity set by -i override the '_NET_WM_WINDOW_OPACITY' values
inactive-opacity-override = false;

# Specify a list of conditions of windows that should always be fully opaque
opacity-rule = [
    "100:class_g = 'dmenu'",
    "100:name *?= 'dmenu'",
    "100:class_g = 'i3lock'",
    "100:class_g = 'i3bar'",
    "100:class_g = 'Dunst'"
];

# ------------------------------------------------------------------------------
# Fading
# ------------------------------------------------------------------------------
# Fade windows in/out when opening/closing and when opacity changes
fading = true;

# Opacity change between steps while fading in (default 0.028)
fade-in-step = 0.03;

# Opacity change between steps while fading out (default 0.03)
fade-out-step = 0.03;

# The time between steps in fade step, in milliseconds (default 10)
fade-delta = 4;

# ------------------------------------------------------------------------------
# General Settings
# ------------------------------------------------------------------------------
# Specify the backend to use: `xrender` or `glx`. `xrender` is universally portable.
backend = "xrender";

# Enable/disable VSync
vsync = true;

# Try to detect WM windows (a non-override-redirect window with no
# child that has 'WM_STATE') and mark them as active.
mark-wmwin-focused = true;

# Mark override-redirect windows that doesn't have a child window with 'WM_STATE' focused.
mark-ovredir-focused = true;

# Detect rounded corners and treat them as not rounded when --dont-rebind-pixmap is set
detect-rounded-corners = true;

# Detect '_NET_WM_WINDOW_OPACITY' on client windows
detect-client-opacity = true;

# Use EWMH '_NET_ACTIVE_WINDOW' to determine currently focused window
use-ewmh-active-win = true;

# Unredirect all windows if a full-screen opaque window is detected
unredir-if-possible = false;

# Use 'WM_TRANSIENT_FOR' to group windows, and consider windows
# in the same group focused at the same time.
detect-transient = true;

# Use 'WM_CLIENT_LEADER' to group windows, and consider windows in the same
# group focused at the same time.
detect-client-leader = true;

# Enable / disable damage tracking to avoid unnecessary redrawing
use-damage = true;

# Set the log level.
log-level = "warn";
